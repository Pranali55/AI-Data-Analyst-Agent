<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AI Data Analyst Agent</title><link rel="stylesheet" href="/static/style.css"></head>
<body><main><header><h1>AI Data Analyst Agent</h1><p>Upload a CSV or Excel file, explore statistics, and ask questions.</p></header><section class="panel"><h2>1. Upload dataset</h2><input id="file" type="file" accept=".csv,.xlsx"><button id="upload">Upload and analyze</button><p id="status"></p></section><section class="panel"><h2>2. Dataset overview</h2><pre id="overview">Upload a dataset to begin.</pre></section><section class="panel"><h2>3. Ask the analyst</h2><input id="question" placeholder="Summarize sales trends and numeric columns" maxlength="500"><button id="ask" disabled>Analyze question</button><pre id="answer"></pre></section><footer>Local development starter · Optional OpenRouter integration</footer></main><script src="/static/app.js"></script></body></html>
